[project]
name = "log-research-agent"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "ddgs>=9.16.1",
    "drain3>=0.9.11",
    "langchain>=1.5.2",
    "langchain-deepseek>=1.2.1",
    "langgraph>=1.2.24",
    "logparser3>=1.0.2",
    "numpy>=2.4.0",
    "openai>=3.57.0",
    "python-dotenv>=1.2.4",
    "regex>=2026.11.19",
    "scikit-learn>=1.8.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.uv]
override-dependencies = ["regex>=2026.11.19"]

[tool.pytest.ini_options]
pythonpath = ["."]
