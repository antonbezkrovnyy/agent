filter {
  if [message] and ("Login OK:" in [message]) {
    mp_normalizer {
      id => "parse_axelnac_specific"
      rules_filepath => "/usr/share/logstash/conf.d/parse/axelnac/norm_rules_axelnac.yml"
      body_field => "message"
      mime_type_field => "mime"
      tag_on_failure => "axelnac_normalizer_failure"
      tag_on_unparsed => "unparsed_axelnac"
      pass_fields => {
        "recv_ipv4" => "recv_ipv4"
        "recv_ipv6" => "recv_ipv6"
      }
    }
    if "unparsed_axelnac" in [tags] or "axelnac_normalizer_failure" in [tags] {
      mutate {
        remove_tag => ["unparsed_axelnac", "axelnac_normalizer_failure"]
      }
    } else {
      mutate {
        add_tag => ["axelnac_normalized"]
        remove_tag => ["unparsed_autonormalizer"]
      }
    }
  }
}
