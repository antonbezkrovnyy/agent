[package]
name = "log-data-plane"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic runtime for approved log Family Bundles"

[dependencies]
aho-corasick = "1"
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
clap = { version = "4", default-features = false, features = ["derive", "std", "help", "usage", "error-context", "suggestions"] }
fancy-regex = "0.16"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
