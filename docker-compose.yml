services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      - POSTGRES_USER=aegra
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aegra_password}
      - POSTGRES_DB=aegra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegra -d aegra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  phoenix:
    image: arizephoenix/phoenix:19.0.0
    restart: unless-stopped
    ports:
      - "6006:6006"
      - "4317:4317"
      - "4318:4318"
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
      - PHOENIX_ENABLE_OTLP=true
      - PHOENIX_DEFAULT_RETENTION_POLICY_DAYS=${PHOENIX_DEFAULT_RETENTION_POLICY_DAYS:-30}
      - PHOENIX_ENABLE_MCP_SERVER=true
      - PHOENIX_ENABLE_MCP_CODE_MODE=false
      - PHOENIX_TELEMETRY_ENABLED=false
    volumes:
      - phoenix_data:/mnt/data

  agent-memory-db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      - POSTGRES_USER=agent_memory
      - POSTGRES_PASSWORD=${AGENT_MEMORY_POSTGRES_PASSWORD:-agent_memory_password}
      - POSTGRES_DB=agent_memory_db
    volumes:
      - agent_memory_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_memory -d agent_memory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:3.99
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm-db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${LITELLM_POSTGRES_PASSWORD:-litellm_password}
      - POSTGRES_DB=litellm_db
    volumes:
      - litellm_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    restart: unless-stopped
    entrypoint: ""
    ports:
      - "4000:4000"
    env_file:
      - ./.env
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-litellm-local-key}
      - LITELLM_LOG=INFO
      - DATABASE_URL=postgresql://litellm:${LITELLM_POSTGRES_PASSWORD:-litellm_password}@litellm-db:5432/litellm_db
      - DIRECT_URL=postgresql://litellm:${LITELLM_POSTGRES_PASSWORD:-litellm_password}@litellm-db:5432/litellm_db
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command: >
      sh -c '
      export UPSTREAM_EMBEDDING_BASE_URL=$${AGENT_MEMORY_EMBEDDING_BASE_URL:-$${LLM_BASE_URL}};
      export UPSTREAM_EMBEDDING_TOKEN=$${AGENT_MEMORY_EMBEDDING_TOKEN:-$${LLM_TOKEN}};
      exec litellm --config /app/config.yaml --host 0.0.0.0 --port 4000
      '
    depends_on:
      litellm-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  aegra:
    build:
      context: https://github.com/aegra/aegra.git
      dockerfile: deployments/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "2026:2026"
    entrypoint: ""
    command: ["uvicorn", "aegra_api.main:app", "--host", "0.0.0.0", "--port", "2026", "--reload"]
    environment:
      # Используем DATABASE_URL вместо отдельных POSTGRES_* переменных
      - DATABASE_URL=postgresql+asyncpg://aegra:${POSTGRES_PASSWORD:-aegra_password}@postgres:5432/aegra_db
      - AGENT_MEMORY_DATABASE_URL=postgresql://agent_memory:${AGENT_MEMORY_POSTGRES_PASSWORD:-agent_memory_password}@agent-memory-db:5432/agent_memory_db
      - ARTIFACT_STORE_BACKEND=s3
      - ARTIFACT_S3_ENDPOINT=http://seaweedfs:8333
      - ARTIFACT_S3_PUBLIC_ENDPOINT=${ARTIFACT_S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      - ARTIFACT_S3_ACCESS_KEY=${ARTIFACT_S3_ACCESS_KEY:-agent}
      - ARTIFACT_S3_SECRET_KEY=${ARTIFACT_S3_SECRET_KEY:-agent-local-secret}
      - LLM_BASE_URL=http://litellm:4000/v1
      - LLM_TOKEN=${LITELLM_AGENT_KEY:-litellm-local-key}
      - LLM_MODEL=logicore-default
      - LLM_MODEL_INTENT=logicore-intent
      - LLM_MODEL_SCOUT=logicore-scout
      - LLM_MODEL_INVESTIGATOR=logicore-investigator
      - LLM_MODEL_REPORTER=logicore-reporter
      - LLM_MODEL_CRITIC=logicore-critic
      - LLM_MODEL_MEMORY=logicore-memory
      - LLM_MODEL_PLANNER=logicore-planner
      - AGENT_FINALIZE_AFTER_SECONDS=600
      - AGENT_FINALIZE_ATTEMPT_TIMEOUT_SECONDS=300
      - AGENT_TIMEOUT_SECONDS=900
      - ANALYSIS_SERVICE_URL=http://analysis-service:9200
      - ANALYSIS_SERVICE_TOKEN=${ANALYSIS_SERVICE_TOKEN:-}
      - ANALYSIS_DATASET_MAX_ROWS=20000
      - ANALYSIS_RESULT_MAX_ROWS=10000
      - ANALYSIS_SQL_MAX_ATTEMPTS=6
      - AGENT_MEMORY_EMBEDDING_MODEL=logicore-embedding
      - AGENT_MEMORY_EMBEDDING_BASE_URL=
      - AGENT_MEMORY_EMBEDDING_TOKEN=
      - PYTHONPATH=/app/src:/app/custom_agent
      - REDIS_BROKER_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
      - WORKER_COUNT=2
      - N_JOBS_PER_WORKER=5
      - OTEL_TARGETS=PHOENIX
      - OTEL_SERVICE_NAME=logicore-agent
      - OTEL_RESOURCE_ATTRIBUTES=openinference.project.name=${PHOENIX_PROJECT:-logicore-agent}
      - PHOENIX_PROJECT=logicore-agent
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      - PHOENIX_ENDPOINT=http://phoenix:6006
    depends_on:
      litellm:
        condition: service_healthy
      postgres:
        condition: service_healthy
      agent-memory-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      phoenix:
        condition: service_started
      logicore-mcp:
        condition: service_healthy
      analysis-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2026/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    env_file:
      - ./.env
    volumes:
      - ./agent:/app/custom_agent:ro
      - ./aegra.json:/app/aegra.json:ro
      - ./README.md:/app/README.md:ro
      - ./AGENTS.md:/app/AGENTS.md:ro
      - ./docs:/app/docs:ro
      - ./logicore-mcp/README.md:/app/logicore-mcp/README.md:ro

  # MCP-сервер Логикора: streamable-http + bearer-токен (ADR-0010), доступен только в Docker-сети
  logicore-mcp:
    build: ./logicore-mcp
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # Токен берётся из LOGIQ_API_TOKEN в .env (env_file)
      - LOGIQ_TRANSPORT=streamable-http
      - LOGIQ_AUTH=token
      - LOGIQ_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  analysis-service:
    build: ./analysis-service
    restart: unless-stopped
    environment:
      - ANALYSIS_SERVICE_TOKEN=${ANALYSIS_SERVICE_TOKEN:-}
      - ANALYSIS_QUERY_TIMEOUT_SECONDS=30
      - ANALYSIS_MAX_RESULT_ROWS=10000
      - ANALYSIS_MEMORY_LIMIT=256MB
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9200/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  agent-mcp:
    build:
      context: .
      dockerfile: agent-mcp/Dockerfile
    restart: unless-stopped
    ports:
      - "9100:9100"
    env_file:
      - ./.env
    environment:
      - AEGRA_API_URL=http://aegra:2026
      - AEGRA_ASSISTANT=agent
      - AGENT_MCP_TOKEN=${AGENT_MCP_TOKEN:-agent-mcp-local-token}
      - ARTIFACT_STORE_BACKEND=s3
      - ARTIFACT_S3_ENDPOINT=http://seaweedfs:8333
      - ARTIFACT_S3_PUBLIC_ENDPOINT=${ARTIFACT_S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      - ARTIFACT_S3_ACCESS_KEY=${ARTIFACT_S3_ACCESS_KEY:-agent}
      - ARTIFACT_S3_SECRET_KEY=${ARTIFACT_S3_SECRET_KEY:-agent-local-secret}
    depends_on:
      aegra:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent-evaluator:
    build:
      context: .
      dockerfile: agent-evaluator/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - AEGRA_API_URL=http://aegra:2026
      - PHOENIX_URL=http://phoenix:6006
      - PHOENIX_PROJECT=logicore-agent
      - PHOENIX_PUBLIC_URL=${PHOENIX_PUBLIC_URL:-http://localhost:6006}
      - AGENT_MEMORY_DATABASE_URL=postgresql://agent_memory:${AGENT_MEMORY_POSTGRES_PASSWORD:-agent_memory_password}@agent-memory-db:5432/agent_memory_db
      - LLM_BASE_URL=http://litellm:4000/v1
      - LLM_TOKEN=${LITELLM_AGENT_KEY:-litellm-local-key}
      - LLM_MODEL=logicore-default
      - LLM_MODEL_EVALUATOR=logicore-evaluator
    depends_on:
      litellm:
        condition: service_healthy
      aegra:
        condition: service_healthy
      agent-memory-db:
        condition: service_healthy
      phoenix:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Приёмник нативного аномали-вебхука Логикора: POST /anomaly → тред в agra → run расследования
  anomaly-relay:
    build: ./anomaly-relay
    restart: unless-stopped
    ports:
      - "2025:8080"
    environment:
      - AGRA_API_URL=http://aegra:2026
      - AGRA_ASSISTANT=agent
      - RELAY_TOKEN=${RELAY_TOKEN:-}
      - DEFAULT_CALLBACK_URL=${DEFAULT_CALLBACK_URL:-}
    depends_on:
      aegra:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  agent-chat-ui:
    build:
      context: ./ui
      args:
        NEXT_PUBLIC_API_URL: http://localhost:2026
        NEXT_PUBLIC_ASSISTANT_ID: agent
        NEXT_PUBLIC_AUTH_SCHEME: ""
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:2026
      - NEXT_PUBLIC_ASSISTANT_ID=agent

  # AG-UI + control API поверх общих Aegra threads/runs, без второго графа.
  agui-agent:
    build:
      context: .
      dockerfile: agui-agent/Dockerfile
    restart: unless-stopped
    ports:
      - "2027:2027"
    env_file:
      - ./.env
    environment:
      - AEGRA_API_URL=http://aegra:2026
      - AEGRA_ASSISTANT=agent
      - AGENT_MEMORY_DATABASE_URL=postgresql://agent_memory:${AGENT_MEMORY_POSTGRES_PASSWORD:-agent_memory_password}@agent-memory-db:5432/agent_memory_db
      - ARTIFACT_STORE_BACKEND=s3
      - ARTIFACT_S3_ENDPOINT=http://seaweedfs:8333
      - ARTIFACT_S3_PUBLIC_ENDPOINT=${ARTIFACT_S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      - ARTIFACT_S3_ACCESS_KEY=${ARTIFACT_S3_ACCESS_KEY:-agent}
      - ARTIFACT_S3_SECRET_KEY=${ARTIFACT_S3_SECRET_KEY:-agent-local-secret}
    depends_on:
      aegra:
        condition: service_healthy
      logicore-mcp:
        condition: service_healthy
      agent-memory-db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2027/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # CopilotKit-рабочий стол поверх AG-UI/Aegra. Отдельный порт, основной UI не трогаем.
  copilotkit-demo:
    build: ./copilotkit-demo
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - AGUI_ENDPOINT_URL=http://agui-agent:2027/agent
      - COPILOTKIT_TELEMETRY_DISABLED=true
    depends_on:
      agui-agent:
        condition: service_healthy
volumes:
  postgres_data:
  litellm_postgres_data:
  agent_memory_data:
  redis_data:
  seaweedfs_data:
  phoenix_data: