services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      - POSTGRES_USER=aegra
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-aegra_password}
      - POSTGRES_DB=aegra_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegra -d aegra_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  phoenix:
    image: arizephoenix/phoenix:19.0.0
    restart: unless-stopped
    ports:
      - "6006:6006"
      - "4317:4317"
      - "4318:4318"
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
      - PHOENIX_ENABLE_OTLP=true
      - PHOENIX_DEFAULT_RETENTION_POLICY_DAYS=${PHOENIX_DEFAULT_RETENTION_POLICY_DAYS:-30}
      - PHOENIX_ENABLE_MCP_SERVER=true
      - PHOENIX_ENABLE_MCP_CODE_MODE=false
      - PHOENIX_TELEMETRY_ENABLED=false
    volumes:
      - phoenix_data:/mnt/data

  agent-memory-db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      - POSTGRES_USER=agent_memory
      - POSTGRES_PASSWORD=${AGENT_MEMORY_POSTGRES_PASSWORD:-agent_memory_password}
      - POSTGRES_DB=agent_memory_db
    volumes:
      - agent_memory_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_memory -d agent_memory_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:3.99
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  aegra:
    build:
      context: https://github.com/aegra/aegra.git
      dockerfile: deployments/docker/Dockerfile
    restart: unless-stopped
    ports:
      - "2026:2026"
    entrypoint: ""
    command: ["uvicorn", "aegra_api.main:app", "--host", "0.0.0.0", "--port", "2026", "--reload"]
    environment:
      # Используем DATABASE_URL вместо отдельных POSTGRES_* переменных
      - DATABASE_URL=postgresql+asyncpg://aegra:${POSTGRES_PASSWORD:-aegra_password}@postgres:5432/aegra_db
      - AGENT_MEMORY_DATABASE_URL=postgresql://agent_memory:${AGENT_MEMORY_POSTGRES_PASSWORD:-agent_memory_password}@agent-memory-db:5432/agent_memory_db
      - ARTIFACT_STORE_BACKEND=s3
      - ARTIFACT_S3_ENDPOINT=http://seaweedfs:8333
      - ARTIFACT_S3_PUBLIC_ENDPOINT=${ARTIFACT_S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      - ARTIFACT_S3_ACCESS_KEY=${ARTIFACT_S3_ACCESS_KEY:-agent}
      - ARTIFACT_S3_SECRET_KEY=${ARTIFACT_S3_SECRET_KEY:-agent-local-secret}
      - PYTHONPATH=/app/src:/app/custom_agent
      - REDIS_BROKER_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
      - WORKER_COUNT=2
      - N_JOBS_PER_WORKER=5
      - OTEL_TARGETS=PHOENIX
      - OTEL_SERVICE_NAME=logicore-agent
      - OTEL_RESOURCE_ATTRIBUTES=openinference.project.name=${PHOENIX_PROJECT:-logicore-agent}
      - PHOENIX_PROJECT=logicore-agent
      - PHOENIX_COLLECTOR_ENDPOINT=http://phoenix:6006/v1/traces
      - PHOENIX_ENDPOINT=http://phoenix:6006
    depends_on:
      postgres:
        condition: service_healthy
      agent-memory-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      phoenix:
        condition: service_started
      logicore-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:2026/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    env_file:
      - ./.env
    volumes:
      - ./agent:/app/custom_agent:ro
      - ./aegra.json:/app/aegra.json:ro

  # MCP-сервер Логикора: streamable-http + bearer-токен (ADR-0010), доступен только в Docker-сети
  logicore-mcp:
    build: ./logicore-mcp
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      # Токен берётся из LOGIQ_API_TOKEN в .env (env_file)
      - LOGIQ_TRANSPORT=streamable-http
      - LOGIQ_AUTH=token
      - LOGIQ_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3).status == 200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  agent-mcp:
    build:
      context: .
      dockerfile: agent-mcp/Dockerfile
    restart: unless-stopped
    ports:
      - "9100:9100"
    env_file:
      - ./.env
    environment:
      - AEGRA_API_URL=http://aegra:2026
      - AEGRA_ASSISTANT=agent
      - AGENT_MCP_TOKEN=${AGENT_MCP_TOKEN:-agent-mcp-local-token}
      - ARTIFACT_STORE_BACKEND=s3
      - ARTIFACT_S3_ENDPOINT=http://seaweedfs:8333
      - ARTIFACT_S3_PUBLIC_ENDPOINT=${ARTIFACT_S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      - ARTIFACT_S3_ACCESS_KEY=${ARTIFACT_S3_ACCESS_KEY:-agent}
      - ARTIFACT_S3_SECRET_KEY=${ARTIFACT_S3_SECRET_KEY:-agent-local-secret}
    depends_on:
      aegra:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9100/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent-evaluator:
    build:
      context: .
      dockerfile: agent-evaluator/Dockerfile
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - AEGRA_API_URL=http://aegra:2026
      - PHOENIX_URL=http://phoenix:6006
      - PHOENIX_PROJECT=logicore-agent
      - PHOENIX_PUBLIC_URL=${PHOENIX_PUBLIC_URL:-http://localhost:6006}
      - AGENT_MEMORY_DATABASE_URL=postgresql://agent_memory:${AGENT_MEMORY_POSTGRES_PASSWORD:-agent_memory_password}@agent-memory-db:5432/agent_memory_db
    depends_on:
      aegra:
        condition: service_healthy
      agent-memory-db:
        condition: service_healthy
      phoenix:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9200/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Приёмник нативного аномали-вебхука Логикора: POST /anomaly → тред в agra → run расследования
  anomaly-relay:
    build: ./anomaly-relay
    restart: unless-stopped
    ports:
      - "2025:8080"
    environment:
      - AGRA_API_URL=http://aegra:2026
      - AGRA_ASSISTANT=agent
      - RELAY_TOKEN=${RELAY_TOKEN:-}
      - DEFAULT_CALLBACK_URL=${DEFAULT_CALLBACK_URL:-}
    depends_on:
      aegra:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  agent-chat-ui:
    build:
      context: ./ui
      args:
        NEXT_PUBLIC_API_URL: http://localhost:2026
        NEXT_PUBLIC_ASSISTANT_ID: agent
        NEXT_PUBLIC_AUTH_SCHEME: ""
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:2026
      - NEXT_PUBLIC_ASSISTANT_ID=agent

  # AG-UI + control API поверх общих Aegra threads/runs, без второго графа.
  agui-agent:
    build:
      context: .
      dockerfile: agui-agent/Dockerfile
    restart: unless-stopped
    ports:
      - "2027:2027"
    env_file:
      - ./.env
    environment:
      - AEGRA_API_URL=http://aegra:2026
      - AEGRA_ASSISTANT=agent
      - AGENT_MEMORY_DATABASE_URL=postgresql://agent_memory:${AGENT_MEMORY_POSTGRES_PASSWORD:-agent_memory_password}@agent-memory-db:5432/agent_memory_db
      - ARTIFACT_STORE_BACKEND=s3
      - ARTIFACT_S3_ENDPOINT=http://seaweedfs:8333
      - ARTIFACT_S3_PUBLIC_ENDPOINT=${ARTIFACT_S3_PUBLIC_ENDPOINT:-http://localhost:8333}
      - ARTIFACT_S3_ACCESS_KEY=${ARTIFACT_S3_ACCESS_KEY:-agent}
      - ARTIFACT_S3_SECRET_KEY=${ARTIFACT_S3_SECRET_KEY:-agent-local-secret}
    depends_on:
      aegra:
        condition: service_healthy
      logicore-mcp:
        condition: service_healthy
      agent-memory-db:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:2027/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # CopilotKit-рабочий стол поверх AG-UI/Aegra. Отдельный порт, основной UI не трогаем.
  copilotkit-demo:
    build: ./copilotkit-demo
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - AGUI_ENDPOINT_URL=http://agui-agent:2027/agent
      - COPILOTKIT_TELEMETRY_DISABLED=true
    depends_on:
      agui-agent:
        condition: service_healthy
volumes:
  postgres_data:
  agent_memory_data:
  redis_data:
  seaweedfs_data:
  phoenix_data: